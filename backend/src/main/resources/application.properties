spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ligacomunio}
spring.datasource.username=${DB_USER:ligacomunio}
spring.datasource.password=${DB_PASSWORD:ligacomunio}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,capacitor://localhost}

apifootball.key=${API_FOOTBALL_KEY:}
apifootball.base-url=https://v3.football.api-sports.io

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl-seconds=900
app.jwt.refresh-ttl-days=30
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Seguridad de la autenticación (ver auth/AuthProperties)
# Intentos fallidos seguidos antes de bloquear; se cuentan por email y por IP.
app.auth.max-intentos=5
app.auth.bloqueo-segundos=900
# Al cabo de este tiempo sin fallar, el contador se olvida.
app.auth.ventana-segundos=900
# Con true, el login exige haber verificado el email. Déjalo en false mientras no haya SMTP.
app.auth.exigir-email-verificado=${EXIGIR_EMAIL_VERIFICADO:false}
app.auth.verificacion-ttl-horas=48
app.auth.reset-ttl-minutos=30
# Base de los enlaces que se envían por correo (la del frontend, sin barra final).
app.auth.url-frontend=${FRONTEND_URL:http://localhost:5173}
app.auth.remitente=${MAIL_FROM:no-reply@ligacomunio.local}
app.auth.limpieza-delay-ms=3600000

# El envío de correo es best-effort (Mailer nunca propaga un fallo: lo escribe en el log), así que un
# SMTP caído o sin configurar no debe hacer que /actuator/health diga DOWN y parezca que la app está rota.
# Sin MAIL_HOST el indicador de Actuator falla siempre, por eso se desactiva.
management.health.mail.enabled=false

# Correo. Sin MAIL_HOST no se configura el envío y los enlaces salen por el log.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Detrás de un proxy inverso con HTTPS: respeta X-Forwarded-* para que la IP del cliente
# (control de intentos) y los enlaces generados sean los reales.
server.forward-headers-strategy=framework

# Reglas del juego (ver league/LeagueProperties)
app.league.season=2024
# Presupuesto que se propone al crear una liga. Quien la crea elige el suyo (y la modalidad de reparto
# inicial), y es el que se guarda en league.initial_budget: ese es el que se reparte a cada miembro.
app.league.initial-budget=40000000
app.league.max-squad-size=18
app.league.max-members=20
app.league.market-size=10
app.league.bid-cap-percent=20
# Puntos que se restan por cada puesto de la alineacion que se quede sin jugador en una jornada.
app.league.empty-slot-penalty=4
app.league.default-interval-seconds=259200
app.league.scheduler-delay-ms=60000

# Simulacion de partidos. La semilla fija el azar: con la misma semilla las jornadas salen identicas,
# y cambiarla genera una temporada distinta (solo afecta a los partidos que aun no se hayan simulado).
app.simulacion.semilla=2024

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
